version: 2
updates:
  # The workflows pin major tags (`actions/checkout@v7`). Nothing rots silently.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 2
    ignore:
      # `@types/node` describes the engines floor (`>=22.19.0`), not the newest
      # Node. Allowing a major bump would happily type the code against APIs
      # that do not exist on the floor, and CI would still pass.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # One PR per week per side, not one per dependency.
      dev:
        dependency-type: development
        patterns: ['*']
