version: 2
updates:
  # The workflows pin major tags (`actions/checkout@v7`). Nothing rots silently.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 2
    groups:
      # One PR per week per side, not one per dependency.
      dev:
        dependency-type: development
        patterns: ['*']
