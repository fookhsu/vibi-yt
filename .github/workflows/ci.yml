name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# A newer push to the same branch/PR makes older runs irrelevant. Never cancel
# on main: a green main run is what release-please reads.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The `engines` floor is real, not decorative: there is no build step, so
        # Node type-strips the .ts sources directly. Test the floor and the LTS.
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Pack check
        run: npm run pack:check

  tarball:
    name: package tarball
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 14
