name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Opens/updates the Release PR: bumps package.json + package-lock.json and
  # prepends the new section to CHANGELOG.md. A human merges that PR, and the
  # merge is what creates the tag and the GitHub Release. No version is ever
  # written to main without a review.
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write # to dispatch publish.yml
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # A PAT makes the Release PR trigger CI. Without the secret the action
          # falls back to GITHUB_TOKEN, which needs the repo toggle
          # "Allow GitHub Actions to create and approve pull requests". See
          # docs/RELEASING.md.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Publishing cannot be coupled with `needs:` here, because npm's trusted
      # publisher is pinned to the filename `publish.yml` — the filename is the
      # half of the trust relationship npm cannot discover for itself. So the
      # coupling is an explicit dispatch, and `--ref main` is deliberate: it
      # reads the workflow from main while `-f ref=$TAG` checks out the release.
      - name: Publish the tag that was just created
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run publish.yml --ref main -f "ref=$TAG"
